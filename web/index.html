<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2B3A67">
<title>OneText</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --ground:#F5F6F8;
    --surface:#FFFFFF;
    --surface-2:#ECEEF3;
    --border:#DDE1E9;
    --ink:#1C2333;
    --ink-muted:#5B6478;
    --ink-faint:#8A93A6;
    --primary:#2B3A67;
    --primary-strong:#1B2748;
    --primary-soft:#E4E8F5;
    --on-primary:#F6F7FB;
    --accent:#D9713C;
    --accent-soft:#F7E4D4;
    --reading-highlight:rgba(217,113,60,.28);
    --success:#3F9142;
    --success-soft:#DFEFDE;
    --danger:#C1503F;
    --danger-soft:#F6DFDA;
    --shadow-sm:0 1px 2px rgba(28,35,51,.06);
    --shadow-md:0 1px 2px rgba(28,35,51,.06),0 8px 24px rgba(28,35,51,.08);
    --radius-lg:18px;
    --radius-md:14px;
    --radius-sm:10px;
    --font-display:'Fraunces',Georgia,'Times New Roman',serif;
    --font-serif:'Source Serif 4',Georgia,serif;
    --font-ui:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#10131C;
      --surface:#191D2A;
      --surface-2:#212636;
      --border:#2B3145;
      --ink:#ECEEF5;
      --ink-muted:#A7AEC2;
      --ink-faint:#747C92;
      --primary:#8593D6;
      --primary-strong:#A6B1E6;
      --primary-soft:#232B47;
      --on-primary:#12151F;
      --accent:#F0995A;
      --accent-soft:#3A2A20;
      --reading-highlight:rgba(240,153,90,.35);
      --success:#6FCB72;
      --success-soft:#1E3320;
      --danger:#E38071;
      --danger-soft:#3A2320;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow-md:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ground:#10131C;
    --surface:#191D2A;
    --surface-2:#212636;
    --border:#2B3145;
    --ink:#ECEEF5;
    --ink-muted:#A7AEC2;
    --ink-faint:#747C92;
    --primary:#8593D6;
    --primary-strong:#A6B1E6;
    --primary-soft:#232B47;
    --on-primary:#12151F;
    --accent:#F0995A;
    --accent-soft:#3A2A20;
    --reading-highlight:rgba(240,153,90,.35);
    --success:#6FCB72;
    --success-soft:#1E3320;
    --danger:#E38071;
    --danger-soft:#3A2320;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  /* min-height (not height) on purpose: this page is often embedded inside a
     host viewer (e.g. an artifact preview) whose available height the host
     controls, not us. A fixed height + overflow:hidden there risks clipping
     content below the fold with no way to scroll to it. min-height lets the
     shell grow to fit whatever it actually contains, so nothing is ever
     trapped — the page scrolls normally, and the tab bar stays pinned via
     position:sticky instead of a height-constrained flex layout. */
  html,body{min-height:100%;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }
  #app-shell{
    width:100%;
    max-width:480px;
    min-height:100dvh;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  @media (min-width:640px){
    body{ align-items:flex-start; padding-block:28px; }
    #app-shell{
      min-height:min(860px,94dvh);
      border-radius:32px;
      box-shadow:var(--shadow-md), 0 0 0 10px var(--surface-2);
      border:1px solid var(--border);
      overflow:hidden;
    }
  }

  h1,h2,h3{ font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; }
  p{ margin:0; }
  button{ font-family:var(--font-ui); }
  .icon{ width:1.1em; height:1.1em; display:inline-block; vertical-align:-0.18em; flex-shrink:0; }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 10px;
    flex-shrink:0;
  }
  .topbar-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--surface-2); color:var(--ink);
    border:none; border-radius:999px; padding:7px 12px;
    font-size:13px; font-weight:700; cursor:pointer;
  }
  .topbar-btn.icon-only{ padding:8px; }
  .brand{ font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-0.01em; }

  /* ---------- scroll area ---------- */
  .main-scroll{ padding-bottom:8px; }
  .pad{ padding:6px 18px 28px; display:flex; flex-direction:column; gap:18px; }

  /* ---------- tab bar ---------- */
  /* margin-top:auto pins it to the bottom of the shell when content is
     short; position:sticky keeps it visible while scrolling past taller
     content — together they cover both cases without ever clipping. */
  .tabbar{
    flex-shrink:0; display:flex; border-top:1px solid var(--border);
    background:var(--surface); padding-bottom:env(safe-area-inset-bottom);
    margin-top:auto; position:sticky; bottom:0; z-index:5;
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:9px 4px 8px; background:none; border:none; color:var(--ink-faint);
    font-size:11px; font-weight:700; cursor:pointer; position:relative;
  }
  .tab-btn.active{ color:var(--primary); }
  .tab-btn .icon{ width:22px; height:22px; }
  .tab-badge{
    position:absolute; top:2px; right:calc(50% - 20px);
    background:var(--accent); color:var(--on-primary); font-size:10px; font-weight:800;
    min-width:16px; height:16px; border-radius:999px; display:flex; align-items:center; justify-content:center;
    padding:0 4px;
  }

  /* ---------- streak / xp chip ---------- */
  .stat-row{ display:flex; gap:10px; }
  .stat-chip{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--surface-2); border-radius:999px; padding:9px 14px;
  }
  .stat-chip .icon{ width:18px; height:18px; }
  .stat-chip .flame{ color:var(--accent); }
  .stat-chip .star{ color:#C99A2E; }
  .stat-num{ font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
  .stat-label{ font-size:11px; color:var(--ink-muted); font-weight:600; }

  /* ---------- daily goal ---------- */
  .goal-card{ background:var(--surface-2); border-radius:var(--radius-md); padding:14px; }
  .goal-top{ display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700; margin-bottom:8px; }
  .goal-top .v{ font-variant-numeric:tabular-nums; color:var(--ink-muted); }
  .goal-fill{ background:var(--primary); }
  .goal-fill.reached{ background:var(--success); }
  .goal-done{ font-size:12px; font-weight:700; color:var(--success); margin-top:6px; }

  /* ---------- card ---------- */
  .card{
    background:var(--surface-2); border-radius:var(--radius-md); padding:16px;
  }
  .card.outline{ background:var(--surface); border:1px solid var(--border); }

  /* ---------- week header ---------- */
  .week-card{ background:var(--primary-soft); border-radius:var(--radius-lg); padding:18px; }
  .week-topic{ font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--primary); text-transform:uppercase; }
  .week-title{ font-family:var(--font-display); font-size:22px; font-weight:600; margin-top:4px; }
  .progress-track{ height:6px; border-radius:999px; background:rgba(0,0,0,.08); margin-top:12px; overflow:hidden; }
  :root[data-theme="dark"] .progress-track, @media (prefers-color-scheme:dark){ .progress-track{ background:rgba(255,255,255,.12); } }
  .progress-fill{ height:100%; background:var(--primary); border-radius:999px; transition:width .3s ease; }
  .week-sub{ margin-top:8px; font-size:12px; color:var(--ink-muted); font-weight:600; }

  /* ---------- day list ---------- */
  .day-list{ display:flex; flex-direction:column; gap:10px; position:relative; }
  .day-row{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:11px 12px;
    text-align:left; width:100%; cursor:pointer;
  }
  .day-row.next{ border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); }
  .day-row.done{ opacity:.72; }
  .day-badge{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff; background:var(--primary);
  }
  .day-row.done .day-badge{ background:var(--success); }
  .day-badge .icon{ width:19px; height:19px; }
  .day-text{ flex:1; min-width:0; }
  .day-text .t{ font-size:14px; font-weight:700; }
  .day-text .s{ font-size:11.5px; color:var(--ink-muted); margin-top:1px; }
  .day-xp{ font-size:11px; font-weight:800; color:var(--success); flex-shrink:0; }
  .chev{ color:var(--ink-faint); width:16px; height:16px; flex-shrink:0; }

  /* ---------- buttons ---------- */
  .btn{
    border:none; border-radius:999px; padding:13px 20px; font-weight:800; font-size:14.5px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  }
  .btn.primary{ background:var(--primary); color:var(--on-primary); }
  .btn.primary:disabled{ opacity:.4; }
  .btn.ghost{ background:var(--surface-2); color:var(--ink); }
  .btn.danger-ghost{ background:var(--danger-soft); color:var(--danger); }
  .btn.sm{ padding:9px 14px; font-size:13px; width:auto; }
  .btn.block-sm{ padding:10px 14px; font-size:13px; }
  .btn.tint-red{ background:var(--danger); color:#fff; }
  .btn.tint-blue{ background:var(--primary); color:var(--on-primary); }
  .btn.tint-green{ background:var(--success); color:#fff; }
  .link-btn{ background:none; border:none; color:var(--primary); font-weight:700; font-size:13px; cursor:pointer; padding:0; }

  /* ---------- day screen ---------- */
  .day-header{ display:flex; align-items:center; gap:12px; }
  .day-header .day-badge{ width:46px; height:46px; }
  .day-header .icon{ width:20px; height:20px; }
  .day-header h2{ font-size:17px; }
  .day-header .s{ font-size:12px; color:var(--ink-muted); margin-top:1px; }
  .level-pill{
    margin-left:auto; font-size:11px; font-weight:800; background:var(--primary-soft); color:var(--primary);
    padding:4px 9px; border-radius:999px; flex-shrink:0;
  }
  .section-label{ font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-muted); }
  .body-text{ font-family:var(--font-serif); font-size:16.5px; line-height:1.6; }
  .tap-word{ cursor:pointer; border-bottom:1px dotted var(--ink-faint); -webkit-tap-highlight-color:transparent; }
  .tap-word:active, .tap-word.picked{ background:var(--accent-soft); border-bottom-color:var(--accent); border-radius:3px; }
  /* A chunk phrase is one clickable unit (no word-level spans inside it) —
     styled as a filled chip rather than an underline, so it visually reads
     as "this whole thing is one expression", not a run of loose words. */
  .tap-chunk{ cursor:pointer; background:var(--primary-soft); color:var(--primary); border-radius:4px; padding:0 2px; -webkit-tap-highlight-color:transparent; }
  .tap-chunk:active{ background:var(--accent-soft); color:var(--accent); }
  /* Per-word highlight that tracks "Ouvir o texto" playback in real time
     (driven by the utterance's word-boundary events, with an estimated
     fallback where the engine never fires them) — this is the visible
     highlight during playback. .read-sentence itself carries no background;
     it only anchors scroll-into-view so the active line stays on screen. */
  .read-word.reading-active{ background:var(--reading-highlight); border-radius:3px; transition:background .12s ease; }
  .listen-row{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
  .listen-btn{
    display:flex; align-items:center; gap:6px; background:var(--primary-soft); color:var(--primary);
    border:none; border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:800; cursor:pointer; flex-shrink:0;
  }
  .listen-btn.active{ background:var(--accent); color:#fff; }
  .listen-btn .icon{ width:14px; height:14px; }
  /* Playback speed picker: a global preference (see S.speechRate), applied
     as a multiplier on every voice in the app, so it's exposed once here on
     the reading screen rather than duplicated per screen. */
  .speed-row{ display:flex; align-items:center; gap:8px; }
  .speed-label{ font-size:11.5px; font-weight:700; color:var(--ink-muted); flex-shrink:0; }
  .speed-pills{ display:flex; gap:5px; }
  .speed-pill{
    background:var(--surface-2); color:var(--ink-muted); border:none; border-radius:999px;
    padding:5px 10px; font-size:11.5px; font-weight:800; cursor:pointer; flex-shrink:0;
  }
  .speed-pill.active{ background:var(--primary); color:var(--on-primary); }
  /* position:fixed (viewport-relative, not shell-relative): the shell's
     height now grows with its content, so an absolutely-positioned overlay
     would be sized/placed against that (possibly much taller, scrolled-away)
     box instead of what's actually on screen. Fixed positioning — plus
     centering to match the shell's own column — keeps these correctly
     placed regardless of scroll position or content length. */
  .word-pop-backdrop{ position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.15); }
  .word-pop{
    position:fixed; left:50%; transform:translateX(-50%);
    width:calc(100% - 28px); max-width:452px;
    background:var(--surface); border-radius:var(--radius-md); box-shadow:var(--shadow-md);
    border:1px solid var(--border); padding:14px; z-index:31;
  }
  .word-pop .eyebrow{ font-size:10px; font-weight:800; letter-spacing:.05em; color:var(--accent); text-transform:uppercase; }
  .word-pop .eyebrow.plain{ color:var(--primary); }
  .word-pop .headword{ display:flex; align-items:center; gap:8px; margin-top:3px; }
  .word-pop .headword b{ font-family:var(--font-display); font-size:19px; font-weight:600; }
  .speak-word{ background:var(--surface-2); border:none; border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; color:var(--ink); }
  .speak-word .icon{ width:14px; height:14px; }
  .word-pop .gloss{ font-size:14px; color:var(--ink); margin-top:6px; line-height:1.5; }
  .word-pop .extra{ font-size:12.5px; color:var(--ink-muted); margin-top:6px; }

  .qa-card{ background:var(--surface-2); border-radius:var(--radius-sm); padding:12px; }
  .qa-q{ font-size:13.5px; font-weight:700; }
  .qa-a{ font-size:12.5px; color:var(--ink-muted); margin-top:5px; }

  .chunk-row{ background:var(--surface-2); border-radius:var(--radius-sm); padding:12px; display:flex; gap:8px; align-items:flex-start; }
  .chunk-toggle-area{ flex:1; display:flex; gap:10px; align-items:flex-start; background:none; border:none; padding:0; text-align:left; cursor:pointer; }
  .chunk-row .speak-word{ flex-shrink:0; }
  .chunk-check{ width:20px; height:20px; border-radius:50%; border:2px solid var(--ink-faint); flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; background:none; padding:0; cursor:pointer; }
  .chunk-check.on{ border-color:var(--success); background:var(--success); color:#fff; }
  .chunk-check .icon{ width:12px; height:12px; display:none; }
  .chunk-check.on .icon{ display:block; }
  .chunk-expr{ font-weight:700; font-size:14.5px; }
  .chunk-mean{ font-size:12.5px; color:var(--ink-muted); margin-top:2px; }
  .chunk-ex{ font-size:12px; color:var(--ink-faint); font-style:italic; margin-top:4px; }

  .colloc-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:13px; display:flex; flex-direction:column; gap:9px; }
  .colloc-list{ display:flex; flex-direction:column; gap:4px; }
  .colloc-item{ font-size:13.5px; display:flex; gap:6px; }
  .usage-box{ background:var(--accent-soft); border-radius:8px; padding:9px 10px; }
  .usage-label{ font-size:10px; font-weight:800; letter-spacing:.05em; color:var(--accent); }
  .usage-text{ font-size:13px; font-style:italic; margin-top:2px; }

  .sentence-row{ display:flex; align-items:center; gap:10px; background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 12px; }
  .play-btn{ width:34px; height:34px; border-radius:50%; background:var(--primary); color:var(--on-primary); border:none; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; }
  .play-btn .icon{ width:16px; height:16px; }
  .play-btn.playing{ background:var(--accent); }
  .sentence-text{ flex:1; font-family:var(--font-serif); font-size:14.5px; }

  .grammar-card{ background:var(--surface-2); border-radius:var(--radius-sm); padding:13px; cursor:pointer; }
  .grammar-title{ display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:14px; }
  .grammar-exp{ font-size:12.5px; color:var(--ink-muted); margin-top:5px; }
  .grammar-ex{ font-size:12px; font-style:italic; color:var(--ink-faint); margin-top:5px; }

  textarea{
    width:100%; min-height:130px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); color:var(--ink); font-family:var(--font-ui); font-size:14px; padding:12px; resize:vertical;
  }
  textarea:focus, input:focus{ outline:2px solid var(--primary); outline-offset:1px; }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border-radius:var(--radius-sm); padding:12px 14px; }
  .switch{ width:44px; height:26px; border-radius:999px; background:var(--border); position:relative; cursor:pointer; flex-shrink:0; border:none; }
  .switch.on{ background:var(--primary); }
  .switch::after{ content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .15s ease; }
  .switch.on::after{ transform:translateX(18px); }

  .footer-cta{ padding:12px 18px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); flex-shrink:0; }

  .empty-state{ text-align:center; padding:50px 20px 20px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .empty-state .icon{ width:42px; height:42px; color:var(--primary); }
  .empty-state h2{ font-size:18px; }
  .empty-state p{ font-size:13.5px; color:var(--ink-muted); line-height:1.5; }

  .banner{ background:var(--primary-soft); border-radius:var(--radius-lg); padding:18px; display:flex; flex-direction:column; gap:10px; align-items:center; text-align:center; }

  /* ---------- onboarding ---------- */
  .onb-hero{ text-align:center; padding:38px 24px 10px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .onb-hero .icon{ width:38px; height:38px; color:var(--primary); }
  .onb-hero h1{ font-size:26px; }
  .onb-hero p{ font-size:13.5px; color:var(--ink-muted); line-height:1.5; max-width:300px; }
  .level-grid{ display:grid; grid-template-columns:1fr 1fr; gap:11px; padding:14px 18px 28px; }
  .level-card{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:4px; min-height:118px; }
  .level-card.locked{ opacity:.55; cursor:not-allowed; }
  .level-card.locked .code{ display:flex; align-items:center; gap:6px; }
  .level-card.locked .code .icon{ width:14px; height:14px; }
  .level-card .code{ font-family:var(--font-display); font-size:20px; font-weight:700; }
  .level-card .name{ font-size:12px; font-weight:800; color:var(--primary); }
  .level-card .desc{ font-size:11px; color:var(--ink-muted); line-height:1.4; margin-top:2px; }

  /* ---------- modal overlay ---------- */
  /* Fixed (viewport-relative) for the same reason as .word-pop above: the
     shell's height is content-driven now, so absolute+inset:0 against it
     could open scrolled out of view. */
  .overlay{
    position:fixed; top:0; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    background:var(--surface); z-index:20;
    display:flex; flex-direction:column;
  }
  .overlay-header{
    display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .overlay-title{ font-family:var(--font-display); font-weight:700; font-size:16px; }
  .overlay-body{ flex:1; overflow-y:auto; }

  /* ---------- review session ---------- */
  .rs-progress{ padding:14px 18px 0; }
  .rs-count{ text-align:center; font-size:11px; color:var(--ink-muted); font-weight:700; margin-top:6px; }
  .rs-source{ display:flex; justify-content:space-between; font-size:11px; font-weight:800; color:var(--primary); text-transform:uppercase; letter-spacing:.04em; }

// The next level unlocks only once a full week is completed at the previous
// one — the starting level chosen at onboarding (S.baseLevel) is always
// unlocked, since CEFR self-placement at the start is normal practice.
function maxUnlockedIndex(){
  const order = CEFR_LEVELS.map(l=>l.id);
  let idx = order.indexOf(S.baseLevel || S.level);
  if (idx < 0) idx = 0;
  (S.completedWeeks||[]).forEach(w=>{
    const li = order.indexOf(w.weeklyText.level);
    if (li >= 0) idx = Math.max(idx, Math.min(order.length-1, li+1));
  });
  return idx;
}
function isLevelUnlocked(levelId){
  return CEFR_LEVELS.map(l=>l.id).indexOf(levelId) <= maxUnlockedIndex();

// Finds the longest contiguous run of `expression`'s words that actually
// appears in `text` (tolerating simple inflection like get→gets via a
// trailing \w*, and skipping window sizes that don't match — real sentences
// often insert other words between parts of a phrasal expression, or use an
// irregular verb form). Returns {start, end} character offsets into `text`,
// or null. Shared by the cloze generator and the chunk-in-context renderer
// below, so both locate a chunk's real words the same way.
function findExpressionSpan(text, expression){
  const cleaned = expression.replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
  const words = cleaned.split(' ').filter(Boolean);
  for (let len = words.length; len >= 1; len--) {
    for (let start = 0; start + len <= words.length; start++) {
      const slice = words.slice(start, start + len);
      const pattern = slice.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*').join('\\s+');
      const re = new RegExp('\\b' + pattern, 'i');
      const m = text.match(re);
      if (m) return { start: m.index, end: m.index + m[0].length };
    }
  }
  return null;
}

// "finally gets to work"). Spans can't legitimately overlap; first found
// wins defensively if something odd ever does.
function findChunkSpans(body, chunks){
  const spans = [];
  (chunks || []).forEach((chunk, chunkIndex) => {
    const span = findExpressionSpan(body, chunk.expression);
    if (span) spans.push({ start: span.start, end: span.end, chunkIndex });
  });
  spans.sort((a, b) => a.start - b.start);
  const resolved = [];
  let lastEnd = -1;
  spans.forEach(s => { if (s.start >= lastEnd) { resolved.push(s); lastEnd = s.end; } });
  return resolved;
}

// Locates each sentence (same splitting as sentencesOf, so indices line up
// with what "Ouvir o texto" iterates) within the body, including trailing
// punctuation — lets the reading highlight mark the sentence currently
// being read, and lets chunk spans nest correctly inside it below.
function findSentenceRanges(body){
  const plain = sentencesOf(body);
  const ranges = [];
  let cursor = 0;
  plain.forEach((sentText, idx) => {
    const start = body.indexOf(sentText, cursor);
    if (start === -1) return;
    let end = start + sentText.length;
    while (end < body.length && /[.!?]/.test(body[end])) end++;
    ranges.push({ start, end, idx });
    cursor = end;
  });
  return ranges;
}

// Wraps plain words individually (tap → dictionary gloss); a chunk span is
// wrapped whole for tapping (so a tap anywhere in the phrase always shows
// the full expression, never an isolated word), but its own words are ALSO
// wrapped (read-only, see renderReadWordsInline) purely so playback can
// highlight them one at a time. Every word span also carries data-off — its
// character offset relative to the enclosing sentence's start — so the
// "Ouvir o texto" playback can map a spoken word straight to its span; base
// is that word's absolute offset in `body`, sentStart is the sentence's.
function renderWordsInline(segment, base, sentStart){
  const re = /[A-Za-zÀ-ÿ']+/g;
  let out = '', last = 0, m;
  while ((m = re.exec(segment))) {
    out += esc(segment.slice(last, m.index));
    const word = m[0];
    const off = base + m.index - sentStart;
    out += `<span class="tap-word read-word" data-w="${esc(word.toLowerCase())}" data-off="${off}" data-len="${word.length}">${esc(word)}</span>`;
    last = m.index + word.length;
  }
  out += esc(segment.slice(last));
  return out;
}
// Same word-splitting as renderWordsInline, but for text INSIDE a chunk
// span: no .tap-word class (a tap must bubble up to the chunk's own click
// handler and show the full phrase, not a lone word's gloss) and no click
// handler of its own — these spans exist only so playback highlighting can
// land on individual words within a chunk instead of lighting up the whole
// chunk chip at once.
function renderReadWordsInline(segment, base, sentStart){
  const re = /[A-Za-zÀ-ÿ']+/g;
  let out = '', last = 0, m;
  while ((m = re.exec(segment))) {
    out += esc(segment.slice(last, m.index));
    const word = m[0];
    const off = base + m.index - sentStart;
    out += `<span class="read-word" data-off="${off}" data-len="${word.length}">${esc(word)}</span>`;
    last = m.index + word.length;
  }
  out += esc(segment.slice(last));
  return out;
}
function renderTappableText(body, chunks){
  const sentenceRanges = findSentenceRanges(body);
  const chunkSpans = findChunkSpans(body, chunks);
  let out = '';
  let cursor = 0;
  sentenceRanges.forEach(sr => {
    out += esc(body.slice(cursor, sr.start));
    out += `<span class="read-sentence" data-sent-idx="${sr.idx}">`;
    let innerCursor = sr.start;
    chunkSpans.filter(cs => cs.start >= sr.start && cs.end <= sr.end).forEach(cs => {
      out += renderWordsInline(body.slice(innerCursor, cs.start), innerCursor, sr.start);
      out += `<span class="tap-chunk" data-chunk-i="${cs.chunkIndex}">${renderReadWordsInline(body.slice(cs.start, cs.end), cs.start, sr.start)}</span>`;
      innerCursor = cs.end;
    });
    out += renderWordsInline(body.slice(innerCursor, sr.end), innerCursor, sr.start);
    out += '</span>';
    cursor = sr.end;
  });
  out += esc(body.slice(cursor));
  return out;
}

function listenCountHint(count){
  count = count || 0;
  if (count === 0) return 'Toque em qualquer palavra para ver o significado.';
  return `Você já ouviu o texto ${count} ${count === 1 ? 'vez' : 'vezes'}. Toque em qualquer palavra para ver o significado.`;
}
function sentencesOf(text){
  return text.replace(/\n/g," ").split(/[.!?]/).map(s=>s.trim()).filter(Boolean);
}
// Finds the longest contiguous run of the expression's words that actually
// appears in the sentence (tolerating simple inflection like get→gets,
// leave→leaves via a trailing \w*), and blanks that span. Real chunk
// examples often insert other words between parts of a phrasal expression
// ("draw a firmer line between") or use an irregular verb form (give→gave),
// so a naive whole-expression match frequently fails; shrinking the window
// guarantees we still find and blank a meaningful, real piece of it.
function makeCloze(sentence, expression){
  const span = findExpressionSpan(sentence, expression);
  if (!span) return sentence;
  return sentence.slice(0, span.start) + '▁▁▁▁▁' + sentence.slice(span.end);
}

/* ---- content generator: local bank + optional Claude (only works when this
   page is hosted outside a sandboxed preview that blocks cross-origin fetch) ---- */
const ContentSource = {
  async weeklyText(level){
    const seed = SEED_TEXTS[level];
    return JSON.parse(JSON.stringify(seed)); // fresh deep copy
  },
  async collocations(expression, level){
    const key = getApiKey();
    if(!key) throw new Error('missing-key');
    const prompt = `Give 3 natural English collocations (word combinations) using the expression "${expression}", suitable for a CEFR ${level.toUpperCase()} English learner. Respond with ONLY valid JSON: {"collocations": ["...", "...", "..."]}`;
    const text = await callClaude(prompt, 300);
    return JSON.parse(text).collocations || [];
  },
  async writingFeedback(userText, originalText, level){
    const key = getApiKey();
    if(!key) throw new Error('missing-key');
    const prompt = `A CEFR ${level.toUpperCase()} Brazilian English learner adapted the following text to their own life:\n\nORIGINAL TEXT:\n${originalText}\n\nLEARNER'S TEXT:\n${userText}\n\nCorrect the learner's text minimally (fix real errors only, keep their voice and level), and explain briefly, in Portuguese, WHY each meaningful correction was made. Respond with ONLY valid JSON: {"correctedText": "...", "notesPT": ["...", "..."]}`;
    const text = await callClaude(prompt, 1200);
    return JSON.parse(text);
  }
};
async function callClaude(prompt, maxTokens){
  const key = getApiKey();
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body: JSON.stringify({ model:'claude-sonnet-5', max_tokens:maxTokens, messages:[{role:'user', content:prompt}] })
  });
  if(!res.ok) throw new Error('http-'+res.status);
  const data = await res.json();
  let text = (data.content||[]).find(b=>b.type==='text')?.text || '';
  text = text.trim();
  if(text.startsWith('```')){ text = text.split('\n').slice(1).join('\n'); if(text.endsWith('```')) text = text.slice(0,-3); }
  return text.trim();
}

/* ============================== SPACED REPETITION ============================== */
function scheduleCard(card, grade){
  if(grade==='again'){
    card.lapses = (card.lapses||0)+1;
    card.repetitions = 0;
    card.intervalDays = 1;
    card.easeFactor = Math.max(1.3, card.easeFactor - 0.2);
  } else if(grade==='good'){
    card.repetitions += 1;
    if(card.repetitions===1) card.intervalDays = 1;
    else if(card.repetitions===2) card.intervalDays = 6;
    else card.intervalDays = Math.max(1, Math.round(card.intervalDays * card.easeFactor));
  } else if(grade==='easy'){
    card.repetitions += 1;
    card.easeFactor += 0.15;
    if(card.repetitions<=2) card.intervalDays = 4;
    else card.intervalDays = Math.max(1, Math.round(card.intervalDays * card.easeFactor * 1.3));
  }
  const due = new Date();
  due.setDate(due.getDate() + card.intervalDays);
  card.dueDate = due.toISOString();
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

/* ---- Listening time tracking (drives the daily goal + Ajustes stats) ---- */
function ensureTodayStats(){
  const today = todayStr();
  if (!S.dailyStats || S.dailyStats.date !== today) {
    S.dailyStats = { date: today, listenSeconds: 0 };
  }
}
function addListenSeconds(sec){
  if (!sec || sec <= 0 || !isFinite(sec)) return;
  ensureTodayStats();
  S.dailyStats.listenSeconds += sec;
  S.totalListenSeconds = (S.totalListenSeconds || 0) + sec;
  save();
}
function todayListenSeconds(){
  ensureTodayStats();
  return S.dailyStats.listenSeconds;
}
function formatMinutesSeconds(totalSeconds){
  const mins = Math.floor(totalSeconds / 60);
  const secs = Math.round(totalSeconds % 60);
  if (mins === 0) return `${secs}s`;
  return `${mins} min`;
}
function formatHoursMinutes(totalSeconds){
  const totalMin = Math.round(totalSeconds / 60);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h === 0) return `${m} min`;
  return `${h}h ${m}min`;
}
// Wires start/end/error timing onto a speech utterance so its actual
// playback duration (not an estimate) counts toward the daily goal and the
// all-time total — additive via addEventListener, so it never clobbers the
// onend/onerror handlers each caller also sets for its own UI logic.
function trackListening(u){
  let startedAt = null;
  u.addEventListener('start', () => { startedAt = Date.now(); });
  const finish = () => { if (startedAt) { addListenSeconds((Date.now() - startedAt) / 1000); startedAt = null; } };
  u.addEventListener('end', finish);
  u.addEventListener('error', finish);
}

function registerActivityToday(){
  const today = todayStr();
  if(!S.lastActiveDate){ S.currentStreak = 1; }
  else{
    const d = daysBetween(S.lastActiveDate, today);
    if(d===0){ /* already active */ }
    else if(d===1){ S.currentStreak += 1; }
    else { S.currentStreak = 1; }
  }
  S.lastActiveDate = today;
  S.longestStreak = Math.max(S.longestStreak, S.currentStreak);
}
function evaluateStreakDecay(){
  if(!S.lastActiveDate) return;
  const d = daysBetween(S.lastActiveDate, todayStr());
  if(d>1){ S.currentStreak = 0; save(); }
}

function weekIsComplete(week){ return week && week.completedDays.length===STUDY_DAYS.length; }
function weekProgress(week){ return week ? week.completedDays.length/STUDY_DAYS.length : 0; }

function enqueueReviewCards(week){
  const existing = new Set(S.reviewCards.map(c=>c.sourceTitle+'|'+c.expression));
  week.weeklyText.chunks.forEach(chunk=>{
    const key = week.weeklyText.title+'|'+chunk.expression;
    if(existing.has(key)) return;
    S.reviewCards.push({
      id: crypto.randomUUID(), expression: chunk.expression, meaning: chunk.meaning,
      cloze: makeCloze(chunk.example, chunk.expression), collocations: chunk.collocations,
      usage: chunk.usage, sourceTitle: week.weeklyText.title, sourceLevel: week.weeklyText.level,
      dueDate: new Date().toISOString(), intervalDays:0, easeFactor:2.5, repetitions:0, lapses:0,
    });
  });
}
function dueReviewCards(limit=20){
  const now = new Date();
  return S.reviewCards.filter(c=>new Date(c.dueDate)<=now).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate)).slice(0,limit);
}
function dueReviewCount(){ return S.reviewCards.filter(c=>new Date(c.dueDate)<=new Date()).length; }

function completeDay(dayId){
  const week = S.currentWeek;
  if(!week) return;
  const already = week.completedDays.includes(dayId);
  if(!already){
    week.completedDays.push(dayId);
    S.xpTotal += dayInfo(dayId).xp;
    registerActivityToday();
    if(dayId==='monday') enqueueReviewCards(week);
  }
  // Note: the completed week is kept as currentWeek (not archived yet) so the
  // "week complete" banner can show on Home; it moves to completedWeeks only
  // when the learner starts the next week (see startNewWeek).
  if(weekIsComplete(week) && !week.completedAt) week.completedAt = new Date().toISOString();
  save();
}
function usedTitles(){
  return S.completedWeeks.map(w=>w.weeklyText.title).concat(S.currentWeek?[S.currentWeek.weeklyText.title]:[]);
}
async function startNewWeek(){
  if(S.currentWeek && weekIsComplete(S.currentWeek)){
    S.completedWeeks.push(S.currentWeek);
  }
  const text = await ContentSource.weeklyText(S.level);
  S.currentWeek = { weeklyText:text, completedDays:[], writingSubmission:'', writingFeedback:null, sundayRecall:'', listenCount:0, startedAt:new Date().toISOString(), completedAt:null };
  save();
}
function gradeReviewCard(id, grade){
  const card = S.reviewCards.find(c=>c.id===id);
  if(!card) return;
  scheduleCard(card, grade);
  S.xpTotal += 5;
  registerActivityToday();
  save();
}

// Builds the backdrop + card DOM (shared by the plain-word and chunk
// popovers) and positions it right next to the tapped span instead of
// always pinning it to the bottom of the screen — flipping above (and
// clamping to the visible viewport) whenever there isn't room below. Both
// the popover and the anchor are positioned relative to the viewport
// (fixed / getBoundingClientRect), so this works regardless of the shell's
// own content-driven height or the current scroll position.
function mountPopoverCard(innerHtml, anchorEl){
  hideWordPopover();
  const shell = document.getElementById('app-shell');
  const backdrop = document.createElement('div');
  backdrop.className = 'word-pop-backdrop';
  backdrop.addEventListener('click', hideWordPopover);

  const pop = document.createElement('div');
  pop.className = 'word-pop';
  pop.style.visibility = 'hidden';
  pop.innerHTML = innerHtml;

  shell.appendChild(backdrop);
  shell.appendChild(pop);

  const viewportHeight = window.innerHeight;
  const popHeight = pop.offsetHeight;
  let top;
  if (anchorEl) {
    const wr = anchorEl.getBoundingClientRect();
    const spaceBelow = viewportHeight - wr.bottom;
    const spaceAbove = wr.top;
    if (spaceBelow >= popHeight + 16) top = wr.bottom + 10;
    else if (spaceAbove >= popHeight + 16) top = wr.top - popHeight - 10;
    else top = Math.max(10, Math.min(viewportHeight - popHeight - 10, wr.bottom + 10));
  } else {
    top = viewportHeight - popHeight - 14;
  }
  pop.style.top = top + 'px';
  pop.style.bottom = 'auto';
  pop.style.visibility = 'visible';

  pop.querySelector('[data-action="speak-word"]').addEventListener('click', (e) => {
    e.stopPropagation();
    speakText(e.currentTarget.dataset.w);
  });
  return pop;
}

/* ---- Voice selection: prefer a male English voice ---- */
// The Web Speech API has no gender field on SpeechSynthesisVoice, so this
// matches against the well-known male voice names shipped by major
// platforms (iOS/macOS, Android/Chrome, Windows/Edge). Voices often load
// asynchronously, so we cache the list and refresh it on 'voiceschanged'.
let cachedVoices = [];
function refreshVoices(){
  if ('speechSynthesis' in window) cachedVoices = speechSynthesis.getVoices();
}
if ('speechSynthesis' in window) {
  refreshVoices();
  speechSynthesis.onvoiceschanged = refreshVoices;
}
function pickEnglishVoice(){
  if (!cachedVoices.length) refreshVoices();
  // No gender preference — the male-voice match was landing on low-quality
  // novelty voices (e.g. iOS's "Fred", robotic and hard to understand) on
  // some devices, which is worse than the accent/gender trade-off it was
  // meant to fix. Just prefer American English (this app teaches US
  // English) and otherwise take whatever the OS considers its default
  // English voice — normally a clear, natural-sounding one.
  const us = cachedVoices.filter(v => v.lang && v.lang.toLowerCase() === 'en-us');
  const english = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  return us[0] || english[0] || null;
}
// `rate` is each call site's own baseline (full-text playback reads a bit
// slower than a single tapped word, for example); S.speechRate is the
// learner's own global speed preference (see the picker on Monday's reading
// screen), applied as a multiplier on top so it affects every voice in the
// app consistently, not just one screen.
function applyVoice(utterance, rate){
  const voice = pickEnglishVoice();
  if (voice) utterance.voice = voice;
  utterance.lang = 'en-US';
  utterance.rate = rate * (S.speechRate || 1);
}
function speakText(text, rate){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  applyVoice(u, rate || 0.9);
  trackListening(u);
  speechSynthesis.speak(u);
}

/* Plays every sentence of a text back-to-back (vs. Wednesday's one-at-a-time
   shadowing practice) — a plain "listen to the whole thing" control. */
let fullPlaybackActive = false;
function playFullText(sentences, onStateChange, onError, onSentenceChange, onWordBoundary){
  stopFullText();
  if (!('speechSynthesis' in window)) { onError && onError(); return; }
  fullPlaybackActive = true;
  let i = 0;
  function next(){
    if (!fullPlaybackActive || i >= sentences.length) { fullPlaybackActive = false; onStateChange(false); onSentenceChange && onSentenceChange(-1); onWordBoundary && onWordBoundary(-1, -1); return; }
    onSentenceChange && onSentenceChange(i);
    const sentText = sentences[i] + '.';
    const u = new SpeechSynthesisUtterance(sentText);
    applyVoice(u, 0.92);
    trackListening(u);

    // Word-level highlight: the 'boundary' event gives the real spoken
    // position, so prefer it. Some engines (notably certain iOS Safari
    // webview contexts) never fire it at all — there we fall back to an
    // estimated word-by-word advance timed from the utterance's own rate,
    // so the highlight still roughly tracks the voice instead of sitting
    // frozen on the first word for the whole sentence. The fallback backs
    // off the instant a real boundary event shows up.
    let boundaryFired = false;
    const wordOffsets = [];
    const re = /[A-Za-zÀ-ÿ']+/g;
    let wm;
    while ((wm = re.exec(sentText))) wordOffsets.push(wm.index);
    let fallbackTimer = null;
    function clearFallback(){ if (fallbackTimer) { clearInterval(fallbackTimer); fallbackTimer = null; } }
    u.onboundary = (ev) => {
      if (ev.name && ev.name !== 'word') return;
      boundaryFired = true;
      clearFallback();
      onWordBoundary && onWordBoundary(i, ev.charIndex);
    };
    u.onstart = () => {
      setTimeout(() => {
        if (boundaryFired || !fullPlaybackActive || !wordOffsets.length) return;
        let wi = 0;
        onWordBoundary && onWordBoundary(i, wordOffsets[0]);
        const stepMs = Math.max(180, 400 / (u.rate || 1));
        fallbackTimer = setInterval(() => {
          wi += 1;
          if (boundaryFired || wi >= wordOffsets.length) { clearFallback(); return; }
          onWordBoundary && onWordBoundary(i, wordOffsets[wi]);
        }, stepMs);
      }, 250);
    };
    u.onend = () => { clearFallback(); i += 1; next(); };
    u.onerror = () => { clearFallback(); fullPlaybackActive = false; onStateChange(false); onSentenceChange && onSentenceChange(-1); onWordBoundary && onWordBoundary(-1, -1); onError && onError(); };
    speechSynthesis.speak(u);
  }
  onStateChange(true);
  next();
}
function stopFullText(){
  fullPlaybackActive = false;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

function statRowHtml(){

function goalCardHtml(){

function bindDay(dayId){

        </div>`).join('')}

    <p class="hint">Marque como revisado cada expressão depois de entender o significado no contexto.</p>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${text.chunks.map((c,i)=>`
        <div class="chunk-row">
          <button class="chunk-toggle-area" data-action="toggle-chunk" data-i="${i}">

            <span>

            </span>
          </button>

        </div>`).join('')}

  </div>
  ${footerCta('monday', done)}`;
}
function bindMonday(){
  bindBackAndComplete('monday');
  root.querySelectorAll('[data-action="reveal-answer"]').forEach(btn=>btn.addEventListener('click', ()=>{
    const el = root.querySelector(`[data-hidden-answer="${btn.dataset.i}"]`);
    el.style.display='block'; btn.style.display='none';
  }));
  root.querySelectorAll('[data-action="set-speech-rate"]').forEach(btn=>btn.addEventListener('click', ()=>{
    S.speechRate = parseFloat(btn.dataset.rate);
    save();
    // Takes effect from the next utterance onward (mid-sentence audio isn't
    // restarted) — playFullText builds a fresh SpeechSynthesisUtterance per
    // sentence and reads S.speechRate again each time, so this is enough.
    root.querySelectorAll('[data-action="set-speech-rate"]').forEach(b=>b.classList.toggle('active', parseFloat(b.dataset.rate)===S.speechRate));
  }));
  const done = S.currentWeek.completedDays.includes('monday');
  const set = V.dayState.reviewedChunks;
  function refreshBtn(){
    const btn = root.querySelector('[data-action="complete-day"]');
    if(btn && !done) btn.disabled = set.size < S.currentWeek.weeklyText.chunks.length;
  }
  refreshBtn();
  root.querySelectorAll('[data-action="toggle-chunk"]').forEach(row=>row.addEventListener('click', ()=>{
    const i = row.dataset.i;
    if(set.has(i)) set.delete(i); else set.add(i);
    root.querySelector(`[data-chunk-check="${i}"]`).classList.toggle('on');
    refreshBtn();
  }));
  root.querySelectorAll('[data-action="speak-chunk"]').forEach(btn=>btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    speakText(btn.dataset.w, 0.85);
  }));

  const listenBtn = document.querySelector('[data-action="toggle-listen-full"]');
  function clearSentenceHighlight(){
    document.querySelectorAll('.read-word.reading-active').forEach(el => el.classList.remove('reading-active'));
  }
  listenBtn.addEventListener('click', () => {
    if (fullPlaybackActive) {
      stopFullText();
      listenBtn.classList.remove('active');
      document.getElementById('listen-full-label').textContent = 'Ouvir o texto';
      clearSentenceHighlight();
    } else {
      S.currentWeek.listenCount = (S.currentWeek.listenCount || 0) + 1;
      save();
      const countLabel = document.getElementById('listen-count-label');
      if (countLabel) countLabel.textContent = listenCountHint(S.currentWeek.listenCount);
      const sentences = sentencesOf(S.currentWeek.weeklyText.body);
      playFullText(sentences, (playing) => {
        const btn = document.querySelector('[data-action="toggle-listen-full"]');
        const label = document.getElementById('listen-full-label');
        if (!btn || !label) return;
        btn.classList.toggle('active', playing);
        label.textContent = playing ? 'Parar' : 'Ouvir o texto';
      }, () => {
        const label = document.getElementById('listen-full-label');
        if (label) label.textContent = 'Áudio indisponível neste navegador';
        clearSentenceHighlight();
      }, (idx) => {
        // Sentence changed: nothing to paint here anymore (the highlight
        // now lives on individual words, driven by onWordBoundary below) —
        // just clear whatever word was lit from the previous sentence.
        clearSentenceHighlight();
      }, (sentIdx, charIndex) => {
        clearSentenceHighlight();
        if (sentIdx < 0) return;
        const sentEl = document.querySelector(`.read-sentence[data-sent-idx="${sentIdx}"]`);
        if (!sentEl) return;
        let match = null;
        sentEl.querySelectorAll('.read-word').forEach(w => {
          if (parseInt(w.dataset.off, 10) <= charIndex) match = w;
        });
        if (match) {
          match.classList.add('reading-active');
          match.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      });
    }
  });
}

      S.currentWeek.writingFeedback = fb; save();
      document.getElementById('fb-error').style.display='none';
      const box = document.getElementById('fb-box');
      box.style.display='block';
      document.getElementById('fb-text').textContent = fb.correctedText;
      document.getElementById('fb-notes').innerHTML = (fb.notesPT||[]).map(n=>`<div style="font-size:12px;color:var(--ink-muted);margin-top:4px;">• ${esc(n)}</div>`).join('');
    }catch(err){
      document.getElementById('fb-error').style.display='block';
    }
    e.target.textContent = '✨ Corrigir com IA';
  });
}

/* ---- Saturday ---- */
let mediaRecorder=null, recordedChunksArr=[], recordedUrl=null, mediaStream=null;
function viewSaturday(text){
  const done = S.currentWeek.completedDays.includes('saturday');
  return `<div class="pad">
    ${dayHeaderHtml('saturday')}
    <div class="card outline"><p style="font-size:13.5px;">${esc(text.speakingPrompt)}</p></div>
    <div style="font-size:13px;color:var(--ink-muted);display:flex;flex-direction:column;gap:4px;">
      <div>• Leia o texto (ou o que você escreveu na sexta) em voz alta, algumas vezes.</div>
      <div>• Grave-se e ouça sua pronúncia, ritmo e entonação.</div>
      <div>• Depois, tente falar sobre o assunto de forma natural, sem ler.</div>
    </div>
    <div class="card outline" style="gap:12px;display:flex;flex-direction:column;">
      <button class="btn tint-red" data-action="rec-toggle">${icon('mic')} <span id="rec-label">Gravar minha fala</span></button>
      <audio id="rec-player" controls style="width:100%;${recordedUrl?'':'display:none;'}" src="${recordedUrl||''}"></audio>
      <div id="rec-error" class="warn-text" style="display:none;">Permissão de microfone negada. Você ainda pode marcar abaixo que praticou.</div>
      <div class="toggle-row">
        <span style="font-size:12.5px;font-weight:700;">Pratiquei falando em voz alta</span>
        <button class="switch ${V.dayState.practicedSpeaking?'on':''}" data-action="toggle-practiced"></button>
      </div>
    </div>
  </div>
  ${footerCta('saturday', !!recordedUrl || !!V.dayState.practicedSpeaking)}`;
}
function bindSaturday(){
  bindBackAndComplete('saturday');
  const done = S.currentWeek.completedDays.includes('saturday');
  function refreshBtn(){
    const btn = root.querySelector('[data-action="complete-day"]');
    if(btn && !done) btn.disabled = !(recordedUrl || V.dayState.practicedSpeaking);
  }
  document.querySelector('[data-action="toggle-practiced"]').addEventListener('click', (e)=>{
    V.dayState.practicedSpeaking = !V.dayState.practicedSpeaking;
    e.currentTarget.classList.toggle('on');
    refreshBtn();
  });
  document.querySelector('[data-action="rec-toggle"]').addEventListener('click', async (e)=>{
    const label = document.getElementById('rec-label');
    if(mediaRecorder && mediaRecorder.state==='recording'){
      mediaRecorder.stop();
      label.textContent = 'Gravar minha fala';
      return;
    }
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
      recordedChunksArr = [];
      mediaRecorder = new MediaRecorder(mediaStream);
      mediaRecorder.ondataavailable = ev => recordedChunksArr.push(ev.data);
      mediaRecorder.onstop = ()=>{
        const blob = new Blob(recordedChunksArr, {type:'audio/webm'});
        recordedUrl = URL.createObjectURL(blob);
        const player = document.getElementById('rec-player');
        player.src = recordedUrl; player.style.display='block';
        mediaStream.getTracks().forEach(t=>t.stop());
        refreshBtn();
      };
      mediaRecorder.start();
      label.textContent = 'Parar gravação';
    }catch(err){
      document.getElementById('rec-error').style.display='block';
    }
  });
  refreshBtn();
}

/* ============================== REVIEW TAB ============================== */
function viewReview(){
  const total = S.reviewCards.length;
  const due = dueReviewCount();
  if(total===0){
    return `<div class="pad">
      <div class="empty-state">
        ${icon('layers')}
        <h2>Ainda não há cartões de revisão</h2>
        <p>Assim que você concluir a missão de Segunda-feira de uma semana, os 5 chunks dela viram cartões aqui — e ficam disponíveis mesmo depois que você já estiver em outra semana.</p>
      </div>
    </div>`;
  }
  const groups = {};
  S.reviewCards.forEach(c=>{ (groups[c.sourceTitle] = groups[c.sourceTitle]||{level:c.sourceLevel,count:0}).count++; });
  return `<div class="pad">
    <div class="card" style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;">
      ${icon('layers')}
      <div style="font-size:42px;font-weight:800;font-family:var(--font-display);">${due}</div>
      <div style="font-size:13px;color:var(--ink-muted);font-weight:700;">${due===1?'cartão para revisar agora':'cartões para revisar agora'}</div>
      <div style="font-size:11.5px;color:var(--ink-faint);">${total} no total, de todas as semanas já estudadas</div>
      <button class="btn primary" data-action="start-review" ${due===0?'disabled':''}>${icon('play')} Iniciar revisão (+5 XP por cartão)</button>
      ${due===0?`<p class="hint">Tudo revisado por agora. Volte mais tarde — os cartões reaparecem conforme o intervalo de repetição espaçada.</p>`:''}
    </div>
    <div class="section-label">Textos no seu banco de revisão</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${Object.entries(groups).map(([title,g])=>`
        <div class="card outline" style="display:flex;justify-content:space-between;align-items:center;">
          <span>
            <div style="font-size:13.5px;font-weight:700;">${esc(title)}</div>
            <div style="font-size:11.5px;color:var(--ink-muted);">${levelInfo(g.level).code}</div>
          </span>
          <span style="font-size:11.5px;color:var(--ink-muted);">${g.count} chunks</span>
        </div>`).join('')}
    </div>
  </div>`;
}
function bindReview(){
  const btn = root.querySelector('[data-action="start-review"]');
  if(btn) btn.addEventListener('click', ()=>{
    V.reviewCardsSession = dueReviewCards(20);
    V.reviewIndex = 0; V.reviewRevealed = false;
    V.modal = 'review-session';
    render();
  });
}

/* ---- review session (fullscreen overlay) ---- */
function viewReviewSession(){
  const cards = V.reviewCardsSession||[];
  if(V.reviewIndex >= cards.length){
    return `<div class="overlay">
      <div class="overlay-header"><span class="overlay-title">Revisão</span><button class="topbar-btn icon-only" data-action="close-overlay">${icon('x')}</button></div>
      <div class="overlay-body">
        <div class="empty-state">
          ${icon('star')}
          <h2>Revisão concluída!</h2>
          <p>Você revisou ${cards.length} cart${cards.length===1?'ão':'ões'} e ganhou +${cards.length*5} XP.</p>
          <button class="btn primary" data-action="close-overlay" style="margin-top:6px;">Concluir</button>
        </div>
      </div>
    </div>`;
  }
  const card = cards[V.reviewIndex];
  return `<div class="overlay">
    <div class="overlay-header"><span class="overlay-title">Revisão</span><button class="topbar-btn icon-only" data-action="close-overlay">${icon('x')}</button></div>
    <div class="overlay-body">
      <div class="rs-progress">
        <div class="progress-track"><div class="progress-fill" style="width:${(V.reviewIndex/cards.length)*100}%"></div></div>
        <div class="rs-count">${V.reviewIndex+1} de ${cards.length}</div>
      </div>
      <div class="pad" style="padding-top:8px;">
        <div class="card outline">
          <div class="rs-source"><span>${esc(card.sourceTitle)}</span><span>${levelInfo(card.sourceLevel).code}</span></div>
          <div class="rs-cloze">${esc(card.cloze)}</div>
          ${V.reviewRevealed?`
            <div class="rs-answer">
              <div><div class="rs-expr">${esc(card.expression)}</div><div class="rs-mean">${esc(card.meaning)}</div></div>
              <div>
                <div class="section-label" style="margin-bottom:5px;">Collocations</div>
                ${card.collocations.map(c=>`<div class="colloc-item">• ${esc(c)}</div>`).join('')}
              </div>
              <div class="usage-box"><div class="usage-label">Contexto de aplicação</div><div class="usage-text">${esc(card.usage)}</div></div>
            </div>`:''}
        </div>
      </div>
    </div>
    ${V.reviewRevealed ? `
      <div class="grade-row">
        <button class="grade-btn" style="background:var(--danger);" data-action="grade" data-g="again">Não lembrei</button>
        <button class="grade-btn" style="background:var(--primary);" data-action="grade" data-g="good">Bom</button>
        <button class="grade-btn" style="background:var(--success);" data-action="grade" data-g="easy">Fácil</button>
      </div>` : `
      <div class="footer-cta"><button class="btn primary" data-action="reveal">Mostrar resposta</button></div>`
    }
  </div>`;
}
function bindReviewSession(){
  document.querySelectorAll('[data-action="close-overlay"]').forEach(b=>b.addEventListener('click', ()=>{ V.modal=null; render(); }));
  const revealBtn = document.querySelector('[data-action="reveal"]');
  if(revealBtn) revealBtn.addEventListener('click', ()=>{ V.reviewRevealed = true; render(); });
  document.querySelectorAll('[data-action="grade"]').forEach(b=>b.addEventListener('click', ()=>{
    const cards = V.reviewCardsSession;
    gradeReviewCard(cards[V.reviewIndex].id, b.dataset.g);
    V.reviewIndex += 1; V.reviewRevealed = false;
    render();
  }));
}

function bindSettings(){
  document.querySelectorAll('[data-action="close-overlay"]').forEach(b=>b.addEventListener('click', closeModal));
  document.querySelector('[data-action="save-key"]').addEventListener('click', ()=>{
    S.apiKey = document.getElementById('api-key-input').value.trim() || null;
    save();
    const b = document.querySelector('[data-action="save-key"]');
    b.textContent = 'Salvo!'; setTimeout(()=>b.textContent='Salvar chave', 1200);

}
function viewLevelChange(){
  return `<div class="overlay">
    <div class="overlay-header"><span class="overlay-title">Alterar nível</span><button class="topbar-btn icon-only" data-action="close-overlay">${icon('x')}</button></div>
    <div class="overlay-body">
      <p class="hint" style="padding:0 18px 10px;">Um nível novo é liberado ao concluir a semana inteira (7 dias) no nível anterior.</p>
      <div class="level-grid">
        ${CEFR_LEVELS.map(l=>{
          const unlocked = isLevelUnlocked(l.id);
          return `
          <button class="level-card ${unlocked?'':'locked'}" data-action="pick-level" data-level="${l.id}" ${unlocked?'':'disabled'} style="${l.id===S.level?'outline:2px solid var(--primary);':''}">
            <span class="code">${l.code} ${unlocked?'':icon('lock')}</span><span class="name">${esc(l.name)}</span>
            <span class="desc">${unlocked ? esc(l.desc) : 'Conclua o nível anterior para desbloquear.'}</span>
          </button>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}
function bindLevelChange(){
  document.querySelectorAll('[data-action="close-overlay"]').forEach(b=>b.addEventListener('click', closeModal));
  document.querySelectorAll('[data-action="pick-level"]').forEach(b=>b.addEventListener('click', async (e)=>{
    const newLevel = e.currentTarget.dataset.level;
    if (!isLevelUnlocked(newLevel)) return;
    if (newLevel === S.level) { closeModal(); return; }
    const week = S.currentWeek;
    const hasProgress = week && !weekIsComplete(week) && week.completedDays.length > 0;
    if (hasProgress) {
      const ok = confirm(`Trocar de nível gera um novo texto da semana nesse nível. Seu progresso na semana atual (${week.completedDays.length} de 7 dias) será perdido. Continuar?`);
      if (!ok) return;
    }
    S.level = newLevel;
    save();
    // Regenerate immediately so the level change is actually visible —
    // otherwise the old week's text (from the previous level) just keeps
    // showing until "Novo texto da semana" is tapped separately.
    await startNewWeek();
    V.modal = null;
    V.pushedDay = null;
    V.tab = 'home';
    render();
  }));
}

evaluateStreakDecay();
