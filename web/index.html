<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2B3A67">
<title>OneText</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --ground:#F5F6F8;
    --surface:#FFFFFF;
    --surface-2:#ECEEF3;
    --border:#DDE1E9;
    --ink:#1C2333;
    --ink-muted:#5B6478;
    --ink-faint:#8A93A6;
    --primary:#2B3A67;
    --primary-strong:#1B2748;
    --primary-soft:#E4E8F5;
    --on-primary:#F6F7FB;
    --accent:#D9713C;
    --accent-soft:#F7E4D4;
    --success:#3F9142;
    --success-soft:#DFEFDE;
    --danger:#C1503F;
    --danger-soft:#F6DFDA;
    --shadow-sm:0 1px 2px rgba(28,35,51,.06);
    --shadow-md:0 1px 2px rgba(28,35,51,.06),0 8px 24px rgba(28,35,51,.08);
    --radius-lg:18px;
    --radius-md:14px;
    --radius-sm:10px;
    --font-display:'Fraunces',Georgia,'Times New Roman',serif;
    --font-serif:'Source Serif 4',Georgia,serif;
    --font-ui:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#10131C;
      --surface:#191D2A;
      --surface-2:#212636;
      --border:#2B3145;
      --ink:#ECEEF5;
      --ink-muted:#A7AEC2;
      --ink-faint:#747C92;
      --primary:#8593D6;
      --primary-strong:#A6B1E6;
      --primary-soft:#232B47;
      --on-primary:#12151F;
      --accent:#F0995A;
      --accent-soft:#3A2A20;
      --success:#6FCB72;
      --success-soft:#1E3320;
      --danger:#E38071;
      --danger-soft:#3A2320;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow-md:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ground:#10131C;
    --surface:#191D2A;
    --surface-2:#212636;
    --border:#2B3145;
    --ink:#ECEEF5;
    --ink-muted:#A7AEC2;
    --ink-faint:#747C92;
    --primary:#8593D6;
    --primary-strong:#A6B1E6;
    --primary-soft:#232B47;
    --on-primary:#12151F;
    --accent:#F0995A;
    --accent-soft:#3A2A20;
    --success:#6FCB72;
    --success-soft:#1E3320;
    --danger:#E38071;
    --danger-soft:#3A2320;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    overscroll-behavior-y:none;
  }
  #app-shell{
    width:100%;
    max-width:480px;
    height:100dvh;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  @media (min-width:640px){
    body{ align-items:center; padding-block:28px; }
    #app-shell{
      height:min(860px,94dvh);
      border-radius:32px;
      box-shadow:var(--shadow-md), 0 0 0 10px var(--surface-2);
      border:1px solid var(--border);
    }
  }

  h1,h2,h3{ font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; }
  p{ margin:0; }
  button{ font-family:var(--font-ui); }
  .icon{ width:1.1em; height:1.1em; display:inline-block; vertical-align:-0.18em; flex-shrink:0; }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 10px;
    flex-shrink:0;
  }
  .topbar-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--surface-2); color:var(--ink);
    border:none; border-radius:999px; padding:7px 12px;
    font-size:13px; font-weight:700; cursor:pointer;
  }
  .topbar-btn.icon-only{ padding:8px; }
  .brand{ font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-0.01em; }

  /* ---------- scroll area ---------- */
  .main-scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:8px; }
  .pad{ padding:6px 18px 28px; display:flex; flex-direction:column; gap:18px; }

  /* ---------- tab bar ---------- */
  .tabbar{
    flex-shrink:0; display:flex; border-top:1px solid var(--border);
    background:var(--surface); padding-bottom:env(safe-area-inset-bottom);
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:9px 4px 8px; background:none; border:none; color:var(--ink-faint);
    font-size:11px; font-weight:700; cursor:pointer; position:relative;
  }
  .tab-btn.active{ color:var(--primary); }
  .tab-btn .icon{ width:22px; height:22px; }
  .tab-badge{
    position:absolute; top:2px; right:calc(50% - 20px);
    background:var(--accent); color:var(--on-primary); font-size:10px; font-weight:800;
    min-width:16px; height:16px; border-radius:999px; display:flex; align-items:center; justify-content:center;
    padding:0 4px;
  }

  /* ---------- streak / xp chip ---------- */
  .stat-row{ display:flex; gap:10px; }
  .stat-chip{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--surface-2); border-radius:999px; padding:9px 14px;
  }
  .stat-chip .icon{ width:18px; height:18px; }
  .stat-chip .flame{ color:var(--accent); }
  .stat-chip .star{ color:#C99A2E; }
  .stat-num{ font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
  .stat-label{ font-size:11px; color:var(--ink-muted); font-weight:600; }

  /* ---------- card ---------- */
  .card{
    background:var(--surface-2); border-radius:var(--radius-md); padding:16px;
  }
  .card.outline{ background:var(--surface); border:1px solid var(--border); }

  /* ---------- week header ---------- */
  .week-card{ background:var(--primary-soft); border-radius:var(--radius-lg); padding:18px; }
  .week-topic{ font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--primary); text-transform:uppercase; }
  .week-title{ font-family:var(--font-display); font-size:22px; font-weight:600; margin-top:4px; }
  .progress-track{ height:6px; border-radius:999px; background:rgba(0,0,0,.08); margin-top:12px; overflow:hidden; }
  :root[data-theme="dark"] .progress-track, @media (prefers-color-scheme:dark){ .progress-track{ background:rgba(255,255,255,.12); } }
  .progress-fill{ height:100%; background:var(--primary); border-radius:999px; transition:width .3s ease; }
  .week-sub{ margin-top:8px; font-size:12px; color:var(--ink-muted); font-weight:600; }

  /* ---------- day list ---------- */
  .day-list{ display:flex; flex-direction:column; gap:10px; position:relative; }
  .day-row{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:11px 12px;
    text-align:left; width:100%; cursor:pointer;
  }
  .day-row.next{ border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); }
  .day-row.done{ opacity:.72; }
  .day-badge{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff; background:var(--primary);
  }
  .day-row.done .day-badge{ background:var(--success); }
  .day-badge .icon{ width:19px; height:19px; }
  .day-text{ flex:1; min-width:0; }
  .day-text .t{ font-size:14px; font-weight:700; }
  .day-text .s{ font-size:11.5px; color:var(--ink-muted); margin-top:1px; }
  .day-xp{ font-size:11px; font-weight:800; color:var(--success); flex-shrink:0; }
  .chev{ color:var(--ink-faint); width:16px; height:16px; flex-shrink:0; }

  /* ---------- buttons ---------- */
  .btn{
    border:none; border-radius:999px; padding:13px 20px; font-weight:800; font-size:14.5px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  }
  .btn.primary{ background:var(--primary); color:var(--on-primary); }
  .btn.primary:disabled{ opacity:.4; }
  .btn.ghost{ background:var(--surface-2); color:var(--ink); }
  .btn.danger-ghost{ background:var(--danger-soft); color:var(--danger); }
  .btn.sm{ padding:9px 14px; font-size:13px; width:auto; }
  .btn.block-sm{ padding:10px 14px; font-size:13px; }
  .btn.tint-red{ background:var(--danger); color:#fff; }
  .btn.tint-blue{ background:var(--primary); color:var(--on-primary); }
  .btn.tint-green{ background:var(--success); color:#fff; }
  .link-btn{ background:none; border:none; color:var(--primary); font-weight:700; font-size:13px; cursor:pointer; padding:0; }

  /* ---------- day screen ---------- */
  .day-header{ display:flex; align-items:center; gap:12px; }
  .day-header .day-badge{ width:46px; height:46px; }
  .day-header .icon{ width:20px; height:20px; }
  .day-header h2{ font-size:17px; }
  .day-header .s{ font-size:12px; color:var(--ink-muted); margin-top:1px; }
  .level-pill{
    margin-left:auto; font-size:11px; font-weight:800; background:var(--primary-soft); color:var(--primary);
    padding:4px 9px; border-radius:999px; flex-shrink:0;
  }
  .section-label{ font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-muted); }
  .body-text{ font-family:var(--font-serif); font-size:16.5px; line-height:1.6; }

  .qa-card{ background:var(--surface-2); border-radius:var(--radius-sm); padding:12px; }
  .qa-q{ font-size:13.5px; font-weight:700; }
  .qa-a{ font-size:12.5px; color:var(--ink-muted); margin-top:5px; }

  .chunk-row{ background:var(--surface-2); border-radius:var(--radius-sm); padding:12px; display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
  .chunk-check{ width:20px; height:20px; border-radius:50%; border:2px solid var(--ink-faint); flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; background:none; padding:0; cursor:pointer; }
  .chunk-check.on{ border-color:var(--success); background:var(--success); color:#fff; }
  .chunk-check .icon{ width:12px; height:12px; display:none; }
  .chunk-check.on .icon{ display:block; }
  .chunk-expr{ font-weight:700; font-size:14.5px; }
  .chunk-mean{ font-size:12.5px; color:var(--ink-muted); margin-top:2px; }
  .chunk-ex{ font-size:12px; color:var(--ink-faint); font-style:italic; margin-top:4px; }

  .colloc-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:13px; display:flex; flex-direction:column; gap:9px; }
  .colloc-list{ display:flex; flex-direction:column; gap:4px; }
  .colloc-item{ font-size:13.5px; display:flex; gap:6px; }
  .usage-box{ background:var(--accent-soft); border-radius:8px; padding:9px 10px; }
  .usage-label{ font-size:10px; font-weight:800; letter-spacing:.05em; color:var(--accent); }
  .usage-text{ font-size:13px; font-style:italic; margin-top:2px; }

  .sentence-row{ display:flex; align-items:center; gap:10px; background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 12px; }
  .play-btn{ width:34px; height:34px; border-radius:50%; background:var(--primary); color:var(--on-primary); border:none; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; }
  .play-btn .icon{ width:16px; height:16px; }
  .play-btn.playing{ background:var(--accent); }
  .sentence-text{ flex:1; font-family:var(--font-serif); font-size:14.5px; }

  .grammar-card{ background:var(--surface-2); border-radius:var(--radius-sm); padding:13px; cursor:pointer; }
  .grammar-title{ display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:14px; }
  .grammar-exp{ font-size:12.5px; color:var(--ink-muted); margin-top:5px; }
  .grammar-ex{ font-size:12px; font-style:italic; color:var(--ink-faint); margin-top:5px; }

  textarea{
    width:100%; min-height:130px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); color:var(--ink); font-family:var(--font-ui); font-size:14px; padding:12px; resize:vertical;
  }
  textarea:focus, input:focus{ outline:2px solid var(--primary); outline-offset:1px; }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border-radius:var(--radius-sm); padding:12px 14px; }
  .switch{ width:44px; height:26px; border-radius:999px; background:var(--border); position:relative; cursor:pointer; flex-shrink:0; border:none; }
  .switch.on{ background:var(--primary); }
  .switch::after{ content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .15s ease; }
  .switch.on::after{ transform:translateX(18px); }

  .footer-cta{ padding:12px 18px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); flex-shrink:0; }

  .empty-state{ text-align:center; padding:50px 20px 20px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .empty-state .icon{ width:42px; height:42px; color:var(--primary); }
  .empty-state h2{ font-size:18px; }
  .empty-state p{ font-size:13.5px; color:var(--ink-muted); line-height:1.5; }

  .banner{ background:var(--primary-soft); border-radius:var(--radius-lg); padding:18px; display:flex; flex-direction:column; gap:10px; align-items:center; text-align:center; }

  /* ---------- onboarding ---------- */
  .onb-hero{ text-align:center; padding:38px 24px 10px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .onb-hero .icon{ width:38px; height:38px; color:var(--primary); }
  .onb-hero h1{ font-size:26px; }
  .onb-hero p{ font-size:13.5px; color:var(--ink-muted); line-height:1.5; max-width:300px; }
  .level-grid{ display:grid; grid-template-columns:1fr 1fr; gap:11px; padding:14px 18px 28px; }
  .level-card{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:4px; min-height:118px; }
  .level-card .code{ font-family:var(--font-display); font-size:20px; font-weight:700; }
  .level-card .name{ font-size:12px; font-weight:800; color:var(--primary); }
  .level-card .desc{ font-size:11px; color:var(--ink-muted); line-height:1.4; margin-top:2px; }

  /* ---------- modal overlay ---------- */
  .overlay{
    position:absolute; inset:0; background:var(--surface); z-index:20;
    display:flex; flex-direction:column;
  }
  .overlay-header{
    display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .overlay-title{ font-family:var(--font-display); font-weight:700; font-size:16px; }
  .overlay-body{ flex:1; overflow-y:auto; }

  /* ---------- review session ---------- */
  .rs-progress{ padding:14px 18px 0; }
  .rs-count{ text-align:center; font-size:11px; color:var(--ink-muted); font-weight:700; margin-top:6px; }
  .rs-source{ display:flex; justify-content:space-between; font-size:11px; font-weight:800; color:var(--primary); text-transform:uppercase; letter-spacing:.04em; }
  .rs-cloze{ font-family:var(--font-serif); font-size:19px; line-height:1.55; margin-top:14px; }
  .rs-answer{ margin-top:16px; padding-top:16px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:14px; }
  .rs-expr{ font-size:17px; font-weight:700; }
  .rs-mean{ font-size:13.5px; color:var(--ink-muted); margin-top:2px; }
  .grade-row{ display:flex; gap:8px; padding:14px 18px calc(16px + env(safe-area-inset-bottom)); }
  .grade-btn{ flex:1; border:none; border-radius:var(--radius-sm); padding:12px 4px; font-weight:800; font-size:12.5px; color:#fff; cursor:pointer; }

  .settings-row{ display:flex; justify-content:space-between; align-items:center; padding:13px 18px; border-bottom:1px solid var(--border); font-size:13.5px; }
  .settings-row .v{ color:var(--ink-muted); font-variant-numeric:tabular-nums; }
  input[type="password"], input[type="text"]{
    width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-2);
    color:var(--ink); font-family:var(--font-ui); font-size:14px; padding:11px 12px;
  }
  .hint{ font-size:11.5px; color:var(--ink-faint); line-height:1.5; }
  .warn-text{ font-size:12px; color:var(--accent); font-weight:700; }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="app-shell"><div id="app"></div></div>

<script>
"use strict";

/* ============================== ICONS ============================== */

function sentencesOf(text){
  return text.replace(/\n/g," ").split(/[.!?]/).map(s=>s.trim()).filter(Boolean);
}
// Finds the longest contiguous run of the expression's words that actually
// appears in the sentence (tolerating simple inflection like get→gets,
// leave→leaves via a trailing \w*), and blanks that span. Real chunk
// examples often insert other words between parts of a phrasal expression
// ("draw a firmer line between") or use an irregular verb form (give→gave),
// so a naive whole-expression match frequently fails; shrinking the window
// guarantees we still find and blank a meaningful, real piece of it.
function makeCloze(sentence, expression){
  const cleaned = expression.replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
  const words = cleaned.split(' ').filter(Boolean);
  for (let len = words.length; len >= 1; len--) {
    for (let start = 0; start + len <= words.length; start++) {
      const slice = words.slice(start, start + len);
      const pattern = slice.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*').join('\\s+');
      const re = new RegExp('\\b' + pattern, 'i');
      const m = sentence.match(re);
      if (m) {
        return sentence.slice(0, m.index) + '▁▁▁▁▁' + sentence.slice(m.index + m[0].length);
      }
    }
  }
  return sentence;
}

/* ---- content generator: local bank + optional Claude (only works when this
   page is hosted outside a sandboxed preview that blocks cross-origin fetch) ---- */
const ContentSource = {
  async weeklyText(level){
    const seed = SEED_TEXTS[level];
    return JSON.parse(JSON.stringify(seed)); // fresh deep copy
  },
  async collocations(expression, level){
    const key = getApiKey();
    if(!key) throw new Error('missing-key');
    const prompt = `Give 3 natural English collocations (word combinations) using the expression "${expression}", suitable for a CEFR ${level.toUpperCase()} English learner. Respond with ONLY valid JSON: {"collocations": ["...", "...", "..."]}`;
    const text = await callClaude(prompt, 300);
    return JSON.parse(text).collocations || [];
  },
  async writingFeedback(userText, originalText, level){
    const key = getApiKey();
    if(!key) throw new Error('missing-key');
    const prompt = `A CEFR ${level.toUpperCase()} Brazilian English learner adapted the following text to their own life:\n\nORIGINAL TEXT:\n${originalText}\n\nLEARNER'S TEXT:\n${userText}\n\nCorrect the learner's text minimally (fix real errors only, keep their voice and level), and explain briefly, in Portuguese, WHY each meaningful correction was made. Respond with ONLY valid JSON: {"correctedText": "...", "notesPT": ["...", "..."]}`;
    const text = await callClaude(prompt, 1200);
    return JSON.parse(text);
  }
};
async function callClaude(prompt, maxTokens){
  const key = getApiKey();
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body: JSON.stringify({ model:'claude-sonnet-5', max_tokens:maxTokens, messages:[{role:'user', content:prompt}] })
  });
  if(!res.ok) throw new Error('http-'+res.status);
  const data = await res.json();
  let text = (data.content||[]).find(b=>b.type==='text')?.text || '';
  text = text.trim();
  if(text.startsWith('```')){ text = text.split('\n').slice(1).join('\n'); if(text.endsWith('```')) text = text.slice(0,-3); }
  return text.trim();
}

/* ============================== SPACED REPETITION ============================== */
function scheduleCard(card, grade){
  if(grade==='again'){
    card.lapses = (card.lapses||0)+1;
    card.repetitions = 0;
    card.intervalDays = 1;
    card.easeFactor = Math.max(1.3, card.easeFactor - 0.2);
  } else if(grade==='good'){
    card.repetitions += 1;
    if(card.repetitions===1) card.intervalDays = 1;
    else if(card.repetitions===2) card.intervalDays = 6;
    else card.intervalDays = Math.max(1, Math.round(card.intervalDays * card.easeFactor));
  } else if(grade==='easy'){
    card.repetitions += 1;
    card.easeFactor += 0.15;
    if(card.repetitions<=2) card.intervalDays = 4;
    else card.intervalDays = Math.max(1, Math.round(card.intervalDays * card.easeFactor * 1.3));
  }
  const due = new Date();
  due.setDate(due.getDate() + card.intervalDays);
  card.dueDate = due.toISOString();
}

}

function getApiKey(){ return S.apiKey || null; }

function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

function registerActivityToday(){
  const today = todayStr();
  if(!S.lastActiveDate){ S.currentStreak = 1; }
  else{
    const d = daysBetween(S.lastActiveDate, today);
    if(d===0){ /* already active */ }
    else if(d===1){ S.currentStreak += 1; }
    else { S.currentStreak = 1; }
  }
  S.lastActiveDate = today;
  S.longestStreak = Math.max(S.longestStreak, S.currentStreak);
}
function evaluateStreakDecay(){
  if(!S.lastActiveDate) return;
  const d = daysBetween(S.lastActiveDate, todayStr());
  if(d>1){ S.currentStreak = 0; save(); }
}

function weekIsComplete(week){ return week && week.completedDays.length===STUDY_DAYS.length; }
function weekProgress(week){ return week ? week.completedDays.length/STUDY_DAYS.length : 0; }

function enqueueReviewCards(week){
  const existing = new Set(S.reviewCards.map(c=>c.sourceTitle+'|'+c.expression));
  week.weeklyText.chunks.forEach(chunk=>{
    const key = week.weeklyText.title+'|'+chunk.expression;
    if(existing.has(key)) return;
    S.reviewCards.push({
      id: crypto.randomUUID(), expression: chunk.expression, meaning: chunk.meaning,
      cloze: makeCloze(chunk.example, chunk.expression), collocations: chunk.collocations,
      usage: chunk.usage, sourceTitle: week.weeklyText.title, sourceLevel: week.weeklyText.level,
      dueDate: new Date().toISOString(), intervalDays:0, easeFactor:2.5, repetitions:0, lapses:0,
    });
  });
}
function dueReviewCards(limit=20){
  const now = new Date();
  return S.reviewCards.filter(c=>new Date(c.dueDate)<=now).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate)).slice(0,limit);
}
function dueReviewCount(){ return S.reviewCards.filter(c=>new Date(c.dueDate)<=new Date()).length; }

function completeDay(dayId){
  const week = S.currentWeek;
  if(!week) return;
  const already = week.completedDays.includes(dayId);
  if(!already){
    week.completedDays.push(dayId);
    S.xpTotal += dayInfo(dayId).xp;
    registerActivityToday();
    if(dayId==='monday') enqueueReviewCards(week);
  }
  // Note: the completed week is kept as currentWeek (not archived yet) so the
  // "week complete" banner can show on Home; it moves to completedWeeks only
  // when the learner starts the next week (see startNewWeek).
  if(weekIsComplete(week) && !week.completedAt) week.completedAt = new Date().toISOString();
  save();
}
function usedTitles(){
  return S.completedWeeks.map(w=>w.weeklyText.title).concat(S.currentWeek?[S.currentWeek.weeklyText.title]:[]);
}
async function startNewWeek(){
  if(S.currentWeek && weekIsComplete(S.currentWeek)){
    S.completedWeeks.push(S.currentWeek);
  }
  const text = await ContentSource.weeklyText(S.level);
  S.currentWeek = { weeklyText:text, completedDays:[], writingSubmission:'', writingFeedback:null, sundayRecall:'', startedAt:new Date().toISOString(), completedAt:null };
  save();
}
function gradeReviewCard(id, grade){
  const card = S.reviewCards.find(c=>c.id===id);
  if(!card) return;
  scheduleCard(card, grade);
  S.xpTotal += 5;
  registerActivityToday();
  save();
}

  const shell = document.getElementById('app-shell');
  shell.querySelectorAll('.overlay').forEach(el => el.remove());

  shell.appendChild(div.firstElementChild);

  return `<div class="footer-cta">
    <button class="btn ${done?'ghost':'primary'}" data-action="complete-day" data-day="${dayId}" ${(!enabled&&!done)?'disabled':''}>

function bindBackAndComplete(dayId){
  document.querySelector('[data-action="back-home"]').addEventListener('click', ()=>{ V.pushedDay=null; render(); });
  const btn = document.querySelector('[data-action="complete-day"]');
  const alreadyDone = S.currentWeek.completedDays.includes(dayId);
  if(btn && !alreadyDone){
    btn.addEventListener('click', ()=>{
      completeDay(dayId);
      render();
      setTimeout(()=>{ if(V.pushedDay===dayId){ V.pushedDay=null; render(); } }, 550);

function viewDay(dayId){
  const text = S.currentWeek.weeklyText;
  if(dayId==='monday') return viewMonday(text);
  if(dayId==='tuesday') return viewTuesday(text);
  if(dayId==='wednesday') return viewWednesday(text);
  if(dayId==='thursday') return viewThursday(text);
  if(dayId==='friday') return viewFriday(text);
  if(dayId==='saturday') return viewSaturday(text);
  if(dayId==='sunday') return viewSunday(text);
}
function bindDay(dayId){
  if(dayId==='monday') return bindMonday();
  if(dayId==='tuesday') return bindTuesday();
  if(dayId==='wednesday') return bindWednesday();
  if(dayId==='thursday') return bindThursday();
  if(dayId==='friday') return bindFriday();
  if(dayId==='saturday') return bindSaturday();
  if(dayId==='sunday') return bindSunday();
}

function bindTuesday(){
  bindBackAndComplete('tuesday');
  const done = S.currentWeek.completedDays.includes('tuesday');
  const set = V.dayState.reviewedChunks;
  function refreshBtn(){
    const btn = root.querySelector('[data-action="complete-day"]');
    if(btn && !done) btn.disabled = set.size < S.currentWeek.weeklyText.chunks.length;
  }
  refreshBtn();
  root.querySelectorAll('[data-action="toggle-chunk"]').forEach(row=>row.addEventListener('click', (e)=>{

    S.currentWeek.writingSubmission = ta.value; save();
    if(btn && !done) btn.disabled = ta.value.trim().length===0;
  });
  document.querySelector('[data-action="ai-correct"]').addEventListener('click', async (e)=>{
    const text = S.currentWeek.weeklyText;
    e.target.textContent = 'Corrigindo…';
    try{
      const fb = await ContentSource.writingFeedback(ta.value, text.body, S.level);
      S.currentWeek.writingFeedback = fb; save();
      document.getElementById('fb-error').style.display='none';
      const box = document.getElementById('fb-box');
      box.style.display='block';
      document.getElementById('fb-text').textContent = fb.correctedText;
      document.getElementById('fb-notes').innerHTML = (fb.notesPT||[]).map(n=>`<div style="font-size:12px;color:var(--ink-muted);margin-top:4px;">• ${esc(n)}</div>`).join('');
    }catch(err){
      document.getElementById('fb-error').style.display='block';
    }
    e.target.textContent = '✨ Corrigir com IA';
  });
}

/* ---- Saturday ---- */
let mediaRecorder=null, recordedChunksArr=[], recordedUrl=null, mediaStream=null;
function viewSaturday(text){
  const done = S.currentWeek.completedDays.includes('saturday');
  return `<div class="pad">
    ${dayHeaderHtml('saturday')}
    <div class="card outline"><p style="font-size:13.5px;">${esc(text.speakingPrompt)}</p></div>
    <div style="font-size:13px;color:var(--ink-muted);display:flex;flex-direction:column;gap:4px;">
      <div>• Leia o texto (ou o que você escreveu na sexta) em voz alta, algumas vezes.</div>
      <div>• Grave-se e ouça sua pronúncia, ritmo e entonação.</div>
      <div>• Depois, tente falar sobre o assunto de forma natural, sem ler.</div>
    </div>
    <div class="card outline" style="gap:12px;display:flex;flex-direction:column;">
      <button class="btn tint-red" data-action="rec-toggle">${icon('mic')} <span id="rec-label">Gravar minha fala</span></button>
      <audio id="rec-player" controls style="width:100%;${recordedUrl?'':'display:none;'}" src="${recordedUrl||''}"></audio>
      <div id="rec-error" class="warn-text" style="display:none;">Permissão de microfone negada. Você ainda pode marcar abaixo que praticou.</div>
      <div class="toggle-row">
        <span style="font-size:12.5px;font-weight:700;">Pratiquei falando em voz alta</span>
        <button class="switch ${V.dayState.practicedSpeaking?'on':''}" data-action="toggle-practiced"></button>
      </div>
    </div>
  </div>
  ${footerCta('saturday', !!recordedUrl || !!V.dayState.practicedSpeaking)}`;
}
function bindSaturday(){
  bindBackAndComplete('saturday');
  const done = S.currentWeek.completedDays.includes('saturday');
  function refreshBtn(){
    const btn = root.querySelector('[data-action="complete-day"]');
    if(btn && !done) btn.disabled = !(recordedUrl || V.dayState.practicedSpeaking);
  }
  document.querySelector('[data-action="toggle-practiced"]').addEventListener('click', (e)=>{
    V.dayState.practicedSpeaking = !V.dayState.practicedSpeaking;
    e.currentTarget.classList.toggle('on');
    refreshBtn();
  });
  document.querySelector('[data-action="rec-toggle"]').addEventListener('click', async (e)=>{
    const label = document.getElementById('rec-label');
    if(mediaRecorder && mediaRecorder.state==='recording'){
      mediaRecorder.stop();
      label.textContent = 'Gravar minha fala';
      return;
    }
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
      recordedChunksArr = [];
      mediaRecorder = new MediaRecorder(mediaStream);
      mediaRecorder.ondataavailable = ev => recordedChunksArr.push(ev.data);
      mediaRecorder.onstop = ()=>{
        const blob = new Blob(recordedChunksArr, {type:'audio/webm'});
        recordedUrl = URL.createObjectURL(blob);
        const player = document.getElementById('rec-player');
        player.src = recordedUrl; player.style.display='block';
        mediaStream.getTracks().forEach(t=>t.stop());
        refreshBtn();
      };
      mediaRecorder.start();
      label.textContent = 'Parar gravação';
    }catch(err){
      document.getElementById('rec-error').style.display='block';
    }
  });
  refreshBtn();
}

/* ============================== REVIEW TAB ============================== */
function viewReview(){
  const total = S.reviewCards.length;
  const due = dueReviewCount();
  if(total===0){
    return `<div class="pad">
      <div class="empty-state">
        ${icon('layers')}
        <h2>Ainda não há cartões de revisão</h2>
        <p>Assim que você concluir a missão de Segunda-feira de uma semana, os 5 chunks dela viram cartões aqui — e ficam disponíveis mesmo depois que você já estiver em outra semana.</p>
      </div>
    </div>`;
  }
  const groups = {};
  S.reviewCards.forEach(c=>{ (groups[c.sourceTitle] = groups[c.sourceTitle]||{level:c.sourceLevel,count:0}).count++; });
  return `<div class="pad">
    <div class="card" style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;">
      ${icon('layers')}
      <div style="font-size:42px;font-weight:800;font-family:var(--font-display);">${due}</div>
      <div style="font-size:13px;color:var(--ink-muted);font-weight:700;">${due===1?'cartão para revisar agora':'cartões para revisar agora'}</div>
      <div style="font-size:11.5px;color:var(--ink-faint);">${total} no total, de todas as semanas já estudadas</div>
      <button class="btn primary" data-action="start-review" ${due===0?'disabled':''}>${icon('play')} Iniciar revisão (+5 XP por cartão)</button>
      ${due===0?`<p class="hint">Tudo revisado por agora. Volte mais tarde — os cartões reaparecem conforme o intervalo de repetição espaçada.</p>`:''}
    </div>
    <div class="section-label">Textos no seu banco de revisão</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${Object.entries(groups).map(([title,g])=>`
        <div class="card outline" style="display:flex;justify-content:space-between;align-items:center;">
          <span>
            <div style="font-size:13.5px;font-weight:700;">${esc(title)}</div>
            <div style="font-size:11.5px;color:var(--ink-muted);">${levelInfo(g.level).code}</div>
          </span>
          <span style="font-size:11.5px;color:var(--ink-muted);">${g.count} chunks</span>
        </div>`).join('')}
    </div>
  </div>`;
}
function bindReview(){
  const btn = root.querySelector('[data-action="start-review"]');
  if(btn) btn.addEventListener('click', ()=>{
    V.reviewCardsSession = dueReviewCards(20);
    V.reviewIndex = 0; V.reviewRevealed = false;
    V.modal = 'review-session';
    render();
  });
}

/* ---- review session (fullscreen overlay) ---- */
function viewReviewSession(){
  const cards = V.reviewCardsSession||[];
  if(V.reviewIndex >= cards.length){
    return `<div class="overlay">
      <div class="overlay-header"><span class="overlay-title">Revisão</span><button class="topbar-btn icon-only" data-action="close-overlay">${icon('x')}</button></div>
      <div class="overlay-body">
        <div class="empty-state">
          ${icon('star')}
          <h2>Revisão concluída!</h2>
          <p>Você revisou ${cards.length} cart${cards.length===1?'ão':'ões'} e ganhou +${cards.length*5} XP.</p>
          <button class="btn primary" data-action="close-overlay" style="margin-top:6px;">Concluir</button>
        </div>
      </div>
    </div>`;
  }
  const card = cards[V.reviewIndex];
  return `<div class="overlay">
    <div class="overlay-header"><span class="overlay-title">Revisão</span><button class="topbar-btn icon-only" data-action="close-overlay">${icon('x')}</button></div>
    <div class="overlay-body">
      <div class="rs-progress">
        <div class="progress-track"><div class="progress-fill" style="width:${(V.reviewIndex/cards.length)*100}%"></div></div>
        <div class="rs-count">${V.reviewIndex+1} de ${cards.length}</div>
      </div>
      <div class="pad" style="padding-top:8px;">
        <div class="card outline">
          <div class="rs-source"><span>${esc(card.sourceTitle)}</span><span>${levelInfo(card.sourceLevel).code}</span></div>
          <div class="rs-cloze">${esc(card.cloze)}</div>
          ${V.reviewRevealed?`
            <div class="rs-answer">
              <div><div class="rs-expr">${esc(card.expression)}</div><div class="rs-mean">${esc(card.meaning)}</div></div>
              <div>
                <div class="section-label" style="margin-bottom:5px;">Collocations</div>
                ${card.collocations.map(c=>`<div class="colloc-item">• ${esc(c)}</div>`).join('')}
              </div>
              <div class="usage-box"><div class="usage-label">Contexto de aplicação</div><div class="usage-text">${esc(card.usage)}</div></div>
            </div>`:''}
        </div>
      </div>
    </div>
    ${V.reviewRevealed ? `
      <div class="grade-row">
        <button class="grade-btn" style="background:var(--danger);" data-action="grade" data-g="again">Não lembrei</button>
        <button class="grade-btn" style="background:var(--primary);" data-action="grade" data-g="good">Bom</button>
        <button class="grade-btn" style="background:var(--success);" data-action="grade" data-g="easy">Fácil</button>
      </div>` : `
      <div class="footer-cta"><button class="btn primary" data-action="reveal">Mostrar resposta</button></div>`
    }
  </div>`;
}
function bindReviewSession(){
  document.querySelectorAll('[data-action="close-overlay"]').forEach(b=>b.addEventListener('click', ()=>{ V.modal=null; render(); }));
  const revealBtn = document.querySelector('[data-action="reveal"]');
  if(revealBtn) revealBtn.addEventListener('click', ()=>{ V.reviewRevealed = true; render(); });
  document.querySelectorAll('[data-action="grade"]').forEach(b=>b.addEventListener('click', ()=>{
    const cards = V.reviewCardsSession;
    gradeReviewCard(cards[V.reviewIndex].id, b.dataset.g);
    V.reviewIndex += 1; V.reviewRevealed = false;
    render();
  }));
}
