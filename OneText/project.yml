name: OneText
options:
  bundleIdPrefix: com.vinicius.onetext
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""

targets:
  OneText:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OneText
    resources:
      - path: OneText/Resources/Assets.xcassets
    info:
      path: OneText/Resources/Info.plist
      properties:
        CFBundleDisplayName: OneText
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Precisamos do microfone para você gravar sua fala e treinar pronúncia (Sábado - Speaking)."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vinicius.onetext
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
